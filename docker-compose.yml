services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - ./app:/var/www/flareweber/app
      - ./module:/var/www/flareweber/module
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    env_file:
      - .env
    volumes:
      - ./app:/var/www/flareweber/app
      - ./module:/var/www/flareweber/module
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: flareweber
      MARIADB_USER: flareweber
      MARIADB_PASSWORD: flareweber
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
