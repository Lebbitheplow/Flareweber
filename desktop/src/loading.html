<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>FlareWeber</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #e6edf3;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .logo span {
        color: #f68b1f;
      }
      .status {
        color: #8b949e;
        font-size: 13px;
        min-height: 18px;
        max-width: 420px;
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #30363d;
        border-top-color: #f68b1f;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <div class="logo">Flare<span>Weber</span></div>
      <div class="status" id="status">Starting the bundled site...</div>
    </div>
    <script>
      const el = document.getElementById('status');
      window.flareweber.getStatus().then((s) => {
        if (s.message) el.textContent = s.message;
      });
      window.flareweber.onStatus((s) => {
        if (s.message) el.textContent = s.message;
      });
    </script>
  </body>
</html>
