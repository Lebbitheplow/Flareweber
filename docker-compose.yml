services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - path: .env
        required: false
    environment:
      # Absolute inside the container; the relative default only works from
      # the repo root, not from app/.
      WORKER_TEMPLATE_PATH: /var/www/flareweber/worker
    volumes:
      - ./app:/var/www/flareweber/app
      - ./module:/var/www/flareweber/module
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: flareweber
      MARIADB_USER: flareweber
      MARIADB_PASSWORD: flareweber
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
