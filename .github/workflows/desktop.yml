name: Desktop App

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Bundle Microweber app + FlareWeber module
        run: node desktop/scripts/prepare-app.mjs
        working-directory: desktop

      - name: Install static-php-cli (Linux bundling)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool cmake pkg-config libtool-bin patchelf
          git clone --depth 1 https://github.com/crazywhalecc/static-php-cli.git /tmp/static-php-cli
          cd /tmp/static-php-cli
          composer install --no-dev -a

      - name: Build static PHP CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp/static-php-cli
          bin/spc download --with-libs="bcmath,bz2,ctype,curl,dom,exif,fileinfo,gd,iconv,intl,mbstring,openssl,pdo,pdo_sqlite,session,simplexml,sqlite3,tokenizer,xml,xmlwriter,zip,zlib" --ignore-cache-sources=php-src --no-zts
          bin/spc build "bcmath,bz2,ctype,curl,dom,exif,fileinfo,gd,iconv,intl,mbstring,openssl,pdo,pdo_sqlite,session,simplexml,sqlite3,tokenizer,xml,xmlwriter,zip,zlib" --build-cli
          mkdir -p desktop/resources/php
          cp build-root/bin/php desktop/resources/php/php
          chmod +x desktop/resources/php/php
          desktop/resources/php/php -v

      - name: Fetch PHP runtime (Windows)
        if: runner.os == 'Windows'
        run: node scripts/fetch-runtime.mjs
        working-directory: desktop

      - name: Install desktop deps
        run: npm install
        working-directory: desktop

      - name: Build installers
        run: npm run build -- ${{ matrix.target }}
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: flareweber-desktop-${{ matrix.os }}
          path: desktop/dist/*
