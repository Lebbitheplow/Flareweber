<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>FlareWeber - Error</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #e6edf3;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 32px;
      }
      h1 {
        font-size: 20px;
        color: #f85149;
        margin: 0;
      }
      pre {
        max-width: 640px;
        white-space: pre-wrap;
        color: #8b949e;
        font-size: 13px;
        background: #161b22;
        padding: 12px 16px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>FlareWeber could not start</h1>
      <pre id="message">Something went wrong starting the bundled site.</pre>
    </div>
    <script>
      window.flareweber.getStatus().then((s) => {
        if (s.message) document.getElementById('message').textContent = s.message;
      });
    </script>
  </body>
</html>
