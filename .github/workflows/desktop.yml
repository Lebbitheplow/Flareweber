name: Desktop App

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  # Microweber 2.0.20 requires ext-intl and ext-sodium (composer.json); the
  # rest is what Laravel, the media library and the FlareWeber compiler use.
  PHP_EXTENSIONS: bcmath,bz2,ctype,curl,dom,exif,fileinfo,gd,iconv,intl,mbstring,openssl,pdo,pdo_sqlite,session,simplexml,sodium,sqlite3,tokenizer,xml,xmlwriter,zip,zlib

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, sodium, gd, zip, bcmath, mbstring, curl
          tools: composer
          coverage: none

      - name: Desktop unit tests
        run: node --test "tests/**/*.test.js"
        working-directory: desktop

      - name: Bundle Microweber app + FlareWeber module + Worker
        run: node scripts/prepare-app.mjs
        working-directory: desktop

      - name: Build static PHP CLI (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/crazywhalecc/static-php-cli.git /tmp/static-php-cli
          cd /tmp/static-php-cli
          composer install --no-dev -a --no-interaction
          bin/spc doctor --auto-fix
          bin/spc download --with-php=8.3 --for-extensions="$PHP_EXTENSIONS" --prefer-pre-built
          bin/spc build "$PHP_EXTENSIONS" --build-cli
          mkdir -p "$GITHUB_WORKSPACE/desktop/resources/php"
          cp buildroot/bin/php "$GITHUB_WORKSPACE/desktop/resources/php/php"
          chmod +x "$GITHUB_WORKSPACE/desktop/resources/php/php"
          "$GITHUB_WORKSPACE/desktop/resources/php/php" -v

      - name: Fetch PHP runtime (Windows)
        if: runner.os == 'Windows'
        run: node scripts/fetch-runtime.mjs
        working-directory: desktop

      - name: Verify bundled payload
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            PHP_BIN=resources/php/php.exe
            PHP_ARGS=(-c resources/php/php.ini)
          else
            PHP_BIN=resources/php/php
            PHP_ARGS=()
          fi
          for f in "$PHP_BIN" resources/microweber/artisan resources/worker/dist/worker.mjs; do
            if [ ! -f "$f" ]; then
              echo "::error::bundled payload is missing $f"
              exit 1
            fi
          done
          "$PHP_BIN" "${PHP_ARGS[@]}" -r 'foreach (["intl","sodium","pdo_sqlite","gd","zip","mbstring","curl","openssl"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing ext $e\n"); exit(1); } } echo "PHP ", PHP_VERSION, " ok\n";'
          grep -q '^2\.0\.20$' resources/microweber/version.txt

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build installers
        run: npm run build -- ${{ matrix.target }}
        working-directory: desktop
        env:
          # Unsigned builds; add signing secrets before enabling notarisation.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: flareweber-desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
